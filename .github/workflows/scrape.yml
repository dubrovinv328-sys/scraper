name: Illinois Plumber License Scraper

on:
  workflow_dispatch:    # Trigger manually from the GitHub Actions tab

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60    # Hard 1-hour cap. GitHub kills the job after this.
    permissions:
      contents: write       # Needed so the job can commit results back to the repo
    steps:
      # ── 1. Checkout (pulls existing progress.txt + plumbers_output.csv) ───
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0      # Full history so we can push back cleanly

      # ── 2. Set up Python ──────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ── 3. Install Python dependencies ────────────────────────────────────
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      # ── 4. Install Chrome + undetected ChromeDriver via SeleniumBase ──────
      - name: Install Chrome and ChromeDriver
        run: |
          seleniumbase install chromedriver latest
          seleniumbase install uc_driver

      # ── 5. Run the scraper in headless mode ───────────────────────────────
      #    - Reads progress.txt to skip already-done cities
      #    - Appends new records to plumbers_output.csv
      - name: Run scraper
        run: python scraper.py --headless
        env:
          PYTHONUNBUFFERED: "1"

      # ── 6. Commit updated CSV + progress back to the repo ─────────────────
      #    This saves progress so the next run picks up where this one left off.
      #    FIX: dropped scraper.log (scraper doesn't create it — was causing
      #    "fatal: pathspec did not match" and silently losing every run's data).
      #    Added pull --rebase before push to avoid race conditions.
      - name: Save results to repo
        if: always()          # Run even if the scraper hit the timeout or errored
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add plumbers_output.csv progress.txt
          if git diff --cached --quiet; then
            echo "No new data to commit (scraper produced nothing or was killed before writing)."
            exit 0
          fi
          git pull --rebase origin main || true
          git commit -m "scraper: results from run #${{ github.run_number }}"
          git push

      # ── 7. Also upload CSV as a downloadable artifact (backup) ────────────
      #    This is your safety net — even if the commit step fails for any
      #    reason, you can download the CSV from the run's Summary page.
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plumbers-run-${{ github.run_number }}
          path: plumbers_output.csv
          retention-days: 90
          if-no-files-found: warn
